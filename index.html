<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Ubungo Municipal Web Atlas</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet"/>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg: #061018;
    --panel: rgba(10, 20, 28, 0.72);
    --panel2: rgba(10, 20, 28, 0.55);
    --text: #e8f2ff;
    --muted: rgba(232,242,255,0.72);
    --accent: #1abc9c;
    --accent2:#3498db;
    --border: rgba(255,255,255,0.12);
    --shadow: 0 18px 45px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  /* ... [Rest of your CSS remains identical] ... */
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Poppins", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .section{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 450ms ease, visibility 450ms ease;
  }
  .section.active{
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  #home{ background: var(--bg); }
  #globe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .hero-scrim{
    position:absolute;
    inset:0;
    background:
      radial-gradient(1200px 700px at 18% 20%, rgba(26,188,156,0.22), transparent 55%),
      radial-gradient(1000px 600px at 78% 75%, rgba(52,152,219,0.18), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .topbar{
    position:absolute;
    top: 18px;
    left: 18px;
    right: 18px;
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    z-index: 5;
  }
  .brand{
    display:flex;
    gap:12px;
    align-items:center;
    padding: 10px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
  }
  .brand-badge{
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(26,188,156,0.95), rgba(52,152,219,0.85));
    display:grid;
    place-items:center;
    font-weight:800;
  }
  .brand-title{
    display:flex;
    flex-direction:column;
    line-height:1.05;
  }
  .brand-title b{ font-size: 13px; letter-spacing:0.2px; }
  .brand-title span{ font-size: 12px; color: var(--muted); }
  .topbar-actions{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .chip{
    padding: 10px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    font-size: 12px;
    color: var(--muted);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .hero{
    position:absolute;
    left: 6%;
    top: 18%;
    width: min(680px, 88vw);
    z-index: 5;
  }
  .hero-card{
    position: relative;
    background: linear-gradient(rgba(6,16,24,0.78), rgba(6,16,24,0.88));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .btn{
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px;
    padding: 12px 14px;
    cursor:pointer;
    font-weight: 700;
    display:flex;
    gap:10px;
    transition: transform 140ms ease;
  }
  .btn-primary{ background: rgba(26,188,156,0.95); color: #04221c; }
  .btn-secondary{ background: rgba(255,255,255,0.06); color: var(--text); }
  .sidebar{
    width: 320px;
    background: rgba(255,255,255,0.06);
    border-right: 1px solid rgba(255,255,255,0.10);
    padding: 14px;
    overflow-y: auto;
  }
  .content{ flex: 1; position: relative; }
  #map{ width: 100%; height: 100%; }

  /* [Remaining existing styles preserved...] */
  #drawerScrim{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.28);
    z-index: 4400;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 220ms ease;
  }
  #sidebarCollapseBtn{
    position: fixed !important;
    bottom: 18px !important;
    left: 18px !important;
    width: 54px !important;
    height: 54px !important;
    border-radius: 999px !important;
    background: rgba(20,30,38,0.90) !important;
    border: 1px solid rgba(255,255,255,0.14) !important;
    z-index: 99999 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="section active" id="home">
  <div id="globe"></div>
  <div class="hero-scrim"></div>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">UM</div>
      <div class="brand-title"><b>UBUNGO MUNICIPAL ATLAS</b><span>3D Globe • 2D Maps</span></div>
    </div>
    <div class="topbar-actions">
      <div class="chip">Basemap: <span id="basemapStatus">Loading…</span></div>
      <button class="chip chip-btn" id="aboutBtn">ℹ️ About Us</button>
    </div>
  </div>
  <div class="hero">
    <div class="hero-card">
      <div class="kicker">📍 Ubungo Municipal • Dar es Salaam</div>
      <h1><b>WELCOME</b></h1>
      <p>Explore Ubungo in 3D and 2D. Visualized by Group No: 05.</p>
      <div class="cta-row">
        <div class="btn btn-primary" onclick="showExplore()">🗺 Enter Atlas →</div>
        <div class="btn btn-secondary" onclick="viewer.camera.flyHome(1.8)">🌍 Reset Globe</div>
      </div>
    </div>
  </div>
</div>

<div class="section" id="explore">
  <div id="drawerScrim"></div>
  <div class="sidebar collapsed">
    <button id="sidebarCollapseBtn"><span></span></button>
    <button class="secondary" onclick="showHome()">← Home</button>
    <div class="title"><b>Explore Ubungo</b></div>
    <div class="layers-group open" id="layersGroup">
      <div class="layer-item">
        <button class="layer-btn" data-layer="landcover">Landcover Map</button>
      </div>
      <div class="layer-item">
        <button class="layer-btn" data-layer="roads">Road Network</button>
      </div>
      </div>
  </div>
  <div class="content">
    <div id="map"></div>
  </div>
</div>

<script>
// KEY FIXES FOR GITHUB PAGES & HTTPS
const GEOSERVER_BASE = "https://ubungo-geoserver.onrender.com/geoserver";
const GEOSERVER_WORKSPACE = "ubungo";
const GEOSERVER_WMS_URL = `${GEOSERVER_BASE}/${GEOSERVER_WORKSPACE}/wms`;

// Logic for screen switching
function showHome(){ 
  document.getElementById('explore').classList.remove('active'); 
  document.getElementById('home').classList.add('active'); 
}
function showExplore(){ 
  document.getElementById('home').classList.remove('active'); 
  document.getElementById('explore').classList.add('active'); 
  setTimeout(()=>map.invalidateSize(), 500); 
}

// Map Logic (Leaflet)
const map = L.map('map').setView([-6.79,39.25],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// GeoServer Layer Loader
const LAYER_SOURCES = {
  landcover: { type: "wms", layers: `${GEOSERVER_WORKSPACE}:landcover_map` },
  roads: { type: "wms", layers: `${GEOSERVER_WORKSPACE}:trunkroad` }
};

async function addLayer(type){
  if(LAYER_SOURCES[type]){
    L.tileLayer.wms(GEOSERVER_WMS_URL, {
      layers: LAYER_SOURCES[type].layers,
      format: 'image/png',
      transparent: true,
      crossOrigin: true
    }).addTo(map);
  }
}

// Cesium Setup
const viewer = new Cesium.Viewer('globe',{
  timeline:false, animation:false, baseLayerPicker:false, terrainProvider:new Cesium.EllipsoidTerrainProvider()
});
viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
  url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
}));

// [Remaining original script logic preserved below...]
</script>
</body>
</html>
