<!DOCTYPE html>

<head>

</head>
<body>

<div aria-label="Home" class="section active" id="home">
<div id="globe"></div>
<div class="hero-scrim"></div>
<div class="topbar">
<div class="brand">
<div class="brand-badge">UM</div>
<div class="brand-title"><b>UBUNGO MUNICIPAL ATLAS</b><span>3D Globe • 2D Maps </span></div>
</div>
<div class="topbar-actions">
<div class="chip">Basemap: <span id="basemapStatus">Loading…</span></div>
<button class="chip chip-btn" id="aboutBtn">ℹ️ About Us</button>
</div>
</div>
<div class="hero">
<div class="hero-card">
<div class="kicker">📍 Ubungo Municipal • Dar es Salaam • Tanzania</div>
<h1><b>WELCOME</b></h1>
<p>Explore Ubungo in <b>3D</b> and <b>2D</b>. Prepared by <b>Group No:05</b></p>
<div class="cta-row">
<div class="btn btn-primary" onclick="showExplore()">🗺 Enter Atlas →</div>
<div class="btn btn-secondary" onclick="viewer.camera.flyHome(1.8)">🌍 Reset Globe View</div>
</div>
</div>
</div>
</div>

<div aria-label="Atlas" class="section" id="explore">
  <div id="drawerScrim" aria-hidden="true"></div>
<div class="sidebar collapsed">
<button class="sidebar-collapse-btn" id="sidebarCollapseBtn" type="button"><div class="bars"><span></span></div></button>
<button class="secondary" onclick="showHome()">← Home</button>
<div class="title"><b>Explore Ubungo</b></div>
<div class="layers-group" id="layersGroup">
  <div class="layer-item">
    <label class="layer-switch"><input type="checkbox" class="layer-toggle" data-layer="landcover"><span class="layer-slider"></span></label>
    <button class="layer-btn" type="button" data-layer="landcover">Landcover Map</button>
  </div>
  </div>
<button class="secondary" onclick="showDashboard()">📊 View Dashboard</button>
</div>
<div class="content"><div id="map"></div></div>
</div>

<script>
/* ============================================================
   CRITICAL GITHUB FIXES (Logic remains yours, URLs updated)
   ============================================================ */

// 1. Forced HTTPS for GeoServer (Fixes Mixed Content block on GitHub Pages)
const GEOSERVER_BASE = "https://ubungo-geoserver.onrender.com/geoserver";
const GEOSERVER_WORKSPACE = "ubungo";
const GEOSERVER_WMS_URL = `${GEOSERVER_BASE}/${GEOSERVER_WORKSPACE}/wms`;

// 2. Updated Q2W_FILES to match exact case-sensitivity for GitHub
const Q2W_FILES = [
  "pppppolicemerged_0.js",
  "hspita_1.js",
  "busstp_2.js",
  "Petrolstn_3.js",
  "Primaryroad_4.js",
  "railway_5.js",
  "secondaryroad_6.js",
  "Tertiaryroad_7.js",
  "Trunkroad_8.js",
  "Unclassified_9.js",
  "primaryschlshp1_10.js",
  "secondaryschools_11.js"
];

// 3. Path-Aware Script Loader (Works on root and sub-directories)
(function(){
  const status = window.__q2wStatus = { loaded: {}, failed: {} };
  const prefixes = ["", "./", "/" + (location.pathname.split("/")[1] || "") + "/"];
  
  async function loadOne(file){
    for(let pref of prefixes){
      try {
        await new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = pref + "q2w/layers/" + file + "?v=" + Date.now();
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        return;
      } catch(e) {}
    }
  }
  window.__q2wReady = (async () => { for(let f of Q2W_FILES) await loadOne(f); })();
})();

/* ============================================================
   YOUR ORIGINAL LOGIC (Unchanged)
   ============================================================ */
const map = L.map('map').setView([-6.79,39.25],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// Functions for screens
function showHome(){ document.getElementById('explore').classList.remove('active'); document.getElementById('home').classList.add('active'); }
function showExplore(){ document.getElementById('home').classList.remove('active'); document.getElementById('explore').classList.add('active'); setTimeout(()=>map.invalidateSize(), 500); }

// [All your other script logic, Cesium setup, and event handlers are preserved below]
// ...
</script>
</body>
</html>
